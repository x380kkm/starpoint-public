[package]
name = "starpoint-personal-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "personal-service-probe"
path = "src/bin/personal_service_probe.rs"

[[bin]]
name = "personal-service"
path = "src/bin/personal_service.rs"

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
crc32fast = "1.5"
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
getrandom = "0.2.15"
pbkdf2 = { version = "0.12.2", features = ["hmac"] }
rmp-serde = "=1.3.0"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "=1.0.128"
sha2 = "0.10.8"
ureq = { version = "=2.10.1", default-features = false, features = ["json", "tls"] }
url = "=2.4.1"

[target.'cfg(target_os = "ios")'.dependencies]
rusqlite = "0.32.1"

[target.'cfg(not(target_os = "ios"))'.dependencies]
ctrlc = "3.4.7"
rusqlite = { version = "0.32.1", features = ["bundled"] }

[dev-dependencies]
tempfile = "=3.12.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
